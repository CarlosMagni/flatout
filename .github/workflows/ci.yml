name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python — install + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e carreralib -e "racelab[dev,mpc,bt-serial]" -e "trackloc[dev]"
      - name: Tests (carreralib + racelab + strategist + trackloc)
        run: |
          (cd carreralib && python -m pytest tests -q)
          (cd racelab && python -m pytest -q)
          (cd strategist && python -m pytest -q)
          (cd trackloc && python -m pytest -q)
      - name: Publication guard
        run: python tools/check_public.py

  install:
    name: Install — ${{ matrix.os }}, newest Python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: install.py, as the double-click installers run it
        run: python install.py --no-launcher
      - name: The app imports in the environment it made
        shell: bash
        run: |
          py=.venv/bin/python; [ -f .venv/Scripts/python.exe ] && py=.venv/Scripts/python.exe
          "$py" -c "import sys, racelab.app, racelab.bots.mpc; print('RaceLab imports on Python', sys.version.split()[0])"

  front:
    name: Front — syntax + serve smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: JS syntax check
        run: find racelab/src/racelab/web -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Serve the app and smoke-test the UI
        run: |
          python -m pip install -e carreralib -e racelab
          racelab --sim --no-browser --port 8130 &
          server=$!
          ok=""
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8130/ >/dev/null && ok=1 && break
            sleep 1
          done
          if [ -z "$ok" ]; then echo "server did not come up"; kill $server 2>/dev/null; exit 1; fi
          curl -sf http://127.0.0.1:8130/ | grep -qi "<!doctype html\|<html"
          curl -sf http://127.0.0.1:8130/ui/js/app.js >/dev/null
          curl -sf http://127.0.0.1:8130/ui/style.css >/dev/null
          echo "UI served: / and /ui assets OK"
          kill $server 2>/dev/null

  firmware:
    name: Firmware — build both images from source, check their SHA-256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build (pinned avr-gcc 5.4.0 in Docker) and compare with firmware/manifest.json
        run: python3 firmware/build.py --check

