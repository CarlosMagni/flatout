<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <title>RaceLab</title>
  <link rel="icon" href="/ui/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/style.css">
  <link rel="stylesheet" href="/ui/pages.css">
  <script type="module" src="/ui/js/app.js"></script>
</head>
<body>
  <!-- Static texts are English by default; js/app.js translates every element
       carrying data-i18n (text), data-i18n-title or data-i18n-aria-label at startup. -->
  <header class="topbar">
    <a class="brand" href="#/race" aria-label="RaceLab"><span class="brand-mark"></span><span class="word">RaceLab</span></a>
    <nav class="tabs" id="tabs" aria-label="Main navigation" data-i18n-aria-label="nav.label">
      <a href="#/race" data-route="race" data-i18n="nav.race">Race</a>
      <a href="#/setup" data-route="setup" data-i18n="nav.setup">Session</a>
      <a href="#/history" data-route="history" data-i18n="nav.history">History</a>
      <a href="#/system" data-route="system" data-i18n="nav.system">System</a>
    </nav>
    <div class="topbar-right">
      <a class="link-pill" id="link-pill" href="#/system"><span class="dot"></span><span class="bots-badge hidden" data-i18n="topbar.bots_badge">BOTS</span><span class="label" data-i18n="topbar.connecting">Connecting…</span></a>
      <div class="seg mode-switch" id="mode-switch" role="group" aria-label="Mode" data-i18n-aria-label="mode.label">
        <button data-mode="classic" data-i18n="mode.classic">Normal</button>
        <button data-mode="advanced" data-i18n="mode.advanced">With bots</button>
      </div>
      <button class="estop hidden" id="estop" type="button" aria-keyshortcuts="Escape" title="Emergency stop for the bots (Esc)" data-i18n="estop.stop" data-i18n-title="estop.title_static">STOP</button>
    </div>
  </header>
  <main id="view"></main>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
